<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Literacy | Official Assessments</title><style>body{margin:0;background:#f2f6fb;color:#14263f;font:16px system-ui,Arial}.hero{background:linear-gradient(125deg,#102b53,#116c83);color:white;padding:42px max(22px,calc((100vw - 1050px)/2))}h1{font-size:clamp(26px,4vw,44px)}main{max-width:1050px;margin:25px auto;padding:0 18px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:#e1eaf4;color:#183557}button.active,button.primary{background:#087b8d;color:white}.test{background:white;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 4px 18px #1b375215}.question{border-top:1px solid #dfe6ef;padding:18px 0}.question p{font-weight:650}.option{display:block;padding:8px;border-radius:8px}.option:hover{background:#f2f7fb}input[type=text]{width:min(90%,640px);padding:12px;border:1px solid #b9c8d9;border-radius:8px}.feedback{padding:10px 14px;background:#e9f4f5;border-radius:8px;margin-top:12px}small{color:#58718a}footer{text-align:center;padding:30px;color:#58718a}</style></head><body><header class="hero"><small style="color:#aee6e8">SECOND YEAR BACCALAUREATE · FINANCIAL LITERACY</small><h1>Unit 1 · Official Weekly Assessments</h1><p>Faithful English translation · 4 assessments · 3 tests each · 60 questions</p></header><main><h2>Choose an assessment</h2><div class="tabs" id="tabs"></div><div id="content"></div></main><footer>Self-study practice · Results are not stored or sent to a teacher.</footer><script>const data=[["Role of Money", [[["What is meant by barter?", ["Borrowing money from a bank", "Exchanging goods to obtain what people need", "Saving money for the future", "Buying goods with money"], 1], ["When the price of a pen is expressed in Egyptian pounds, money performs the function of:", ["Store of value", "Medium of exchange", "A means of saving only", "Unit of account"], 3], ["Barter requires a double coincidence of wants between the two parties.", ["True", "False"], 0], ["The store-of-value function means that money spoils quickly like food.", ["True", "False"], 1], ["Mention one disadvantage of barter.", null, "It requires a double coincidence of wants."]], [["Maryam kept some money to use next month. Which function of money is illustrated?", ["Store of value", "Unit of account", "Medium of exchange", "A measure of the number of goods"], 0], ["Why do people accept modern fiat banknotes?", ["Because they are edible", "Because inflation never affects their value", "Because they trust the government and central bank that issue them", "Because they can always be exchanged for gold"], 2], ["If prices rise while savings remain unchanged, their purchasing power increases.", ["True", "False"], 1], ["When paying for a book with money, money acts as a medium of exchange.", ["True", "False"], 0], ["What is meant by inflation? Answer in one line.", null, "A sustained rise in the general price level."]], [["Which of the following allows payments and money transfers using a mobile phone?", ["Barter", "A banknote", "A mobile wallet", "A piece of gold"], 2], ["Which institution issues banknotes and regulates the amount of money in circulation in Egypt?", ["An insurance company", "The Central Bank of Egypt", "A securities company", "A retail store"], 1], ["Crypto assets are legal tender issued by the central bank.", ["True", "False"], 1], ["Mobile wallets may help people without bank accounts access financial services.", ["True", "False"], 0], ["What is meant by financial inclusion?", null, "Access to and use of suitable financial services by individuals and businesses."]]]], ["Role of Finance in Society", [[["Which of the following is an example of direct finance?", ["A company raises funds from investors by issuing shares", "A company obtains a loan funded by bank deposits", "An individual deposits savings in a bank account", "Paying for goods with a mobile wallet"], 0], ["What does a share represent?", ["An insurance contract", "A short-term loan", "A unit of ownership in a company", "An amount owed by the government"], 2], ["Finance transfers funds from deficit units to surplus units.", ["True", "False"], 1], ["Indirect finance involves a financial intermediary such as a bank.", ["True", "False"], 0], ["What is meant by finance?", null, "The movement of funds from surplus units to deficit units."]], [["Which institution pays compensation when economic losses occur, according to its contracts?", ["A securities company", "The central bank", "A microfinance institution", "An insurance company"], 3], ["Which of the following is a function of the central bank?", ["Selling goods to consumers", "Regulating the amount of money in circulation", "Producing machinery for factories", "Managing retail stores"], 1], ["Securities companies facilitate the buying and selling of shares and bonds.", ["True", "False"], 0], ["Microfinance institutions provide services only to large companies.", ["True", "False"], 1], ["Mention one role of microfinance institutions.", null, "Providing small loans or financial services to small businesses."]], [["A factory bought new machines to increase future production. What is this activity called?", ["Barter", "Personal consumption", "Investment", "Financial exclusion"], 2], ["Which term describes the inability of some people to access financial services?", ["Financial exclusion", "Financial inclusion", "Direct finance", "Saving"], 0], ["Successful investment may create new jobs and increase demand for goods and services.", ["True", "False"], 0], ["A rotating savings association is a formal system in which the government guarantees every member’s payments.", ["True", "False"], 1], ["Mention one benefit of financial technology.", null, "It can make payments and financial services faster or more accessible."]]]], ["Basic Structure of the Economy", [[["Other factors remaining constant, what happens to quantity demanded when the price of a good rises?", ["It increases", "It decreases", "It always disappears", "It is never affected"], 1], ["When does market equilibrium occur?", ["When sales stop", "When imports exceed exports", "When quantity demanded equals quantity supplied", "When one producer monopolizes the market"], 2], ["Other factors remaining constant, quantity supplied increases when the price of a good rises.", ["True", "False"], 0], ["When there is excess supply, the price tends to rise if allowed to adjust.", ["True", "False"], 1], ["What is meant by a market?", null, "An arrangement in which buyers and sellers exchange goods or services."]], [["What is meant by Gross Domestic Product (GDP)?", ["Only the value of a country’s imports", "The number of employed people", "Total household savings", "The total value added from producing goods and services within a country over a given period"], 3], ["Which indicator measures changes in the prices of goods and services purchased by households?", ["Consumer Price Index", "Unemployment rate", "Trade balance", "Exchange rate"], 0], ["A trade surplus occurs when the value of imports exceeds the value of exports.", ["True", "False"], 1], ["Inflation is a sustained rise in the general price level.", ["True", "False"], 0], ["What is meant by the unemployment rate?", null, "The percentage of the labor force that is unemployed and seeking work."]], [["Which economic system combines a market economy with government intervention?", ["Planned economy", "Mixed economy", "Pure market economy", "Barter"], 1], ["Which institution uses monetary policy tools?", ["Insurance companies", "Households", "Retail stores", "The central bank"], 3], ["The government uses spending and taxes as tools of fiscal policy.", ["True", "False"], 0], ["The effects of a supply-chain disruption always remain within one country and never spread to others.", ["True", "False"], 1], ["What is meant by a supply chain?", null, "The network of activities and organizations involved in producing and delivering a product."]]]], ["Understanding Zakat", [[["Which statement describes Zakat?", ["An optional gift with no conditions", "A loan repaid by the poor", "A religious obligation requiring Muslims to give part of their wealth when its conditions are met", "A price paid for a good"], 2], ["What is the rate of Zakat on cash after reaching Nisab and the passage of a full Hijri year?", ["2.5%", "5%", "10%", "20%"], 0], ["The Nisab mentioned in the lesson is equivalent to the value of 85 grams of gold.", ["True", "False"], 0], ["Zakat is due on cash even if it has not reached Nisab.", ["True", "False"], 1], ["Mention one difference between Zakat and Sadaqah.", null, "Zakat is obligatory when its conditions are met, while Sadaqah is voluntary."]], [["According to the lesson, what is the Zakat rate on crops irrigated naturally?", ["2.5%", "20%", "5%", "10%"], 3], ["Which category of Zakat recipients includes those burdened with debts they cannot repay?", ["Zakat administrators", "Those in debt (Al-Gharimin)", "Stranded travelers", "Those whose hearts are to be reconciled"], 1], ["Zakat is due on a residential property merely because it is used as a home.", ["True", "False"], 1], ["One condition for Zakat to be due is that wealth exceeds basic needs.", ["True", "False"], 0], ["Mention one social function of Zakat.", null, "Helping those in need and promoting social solidarity."]], [["Which financing arrangement involves a financial institution purchasing an asset and selling it to a client at cost plus a known profit margin?", ["Murabaha", "Mudarabah", "Sadaqah", "Rotating savings association"], 0], ["What is the arrangement in which one party provides capital and another manages the business, sharing profits at an agreed ratio?", ["Murabaha", "Zakat al-Fitr", "Insurance", "Mudarabah"], 3], ["Sukuk are linked to specific assets, services, or investment activities that comply with Sharia principles.", ["True", "False"], 0], ["Islamic finance permits Riba, which is a gain taking the form of an increase on a loan.", ["True", "False"], 1], ["Mention one economic effect of Zakat.", null, "Redistributing wealth and supporting economic activity."]]]]];let active=0;const tabs=document.querySelector('#tabs'),content=document.querySelector('#content');function render(){tabs.innerHTML='';data.forEach((d,i)=>{let b=document.createElement('button');b.textContent=`Assessment ${i+1}: ${d[0]}`;b.className=i===active?'active':'';b.onclick=()=>{active=i;render()};tabs.append(b)});let d=data[active];content.innerHTML='';d[1].forEach((test,ti)=>{let section=document.createElement('section');section.className='test';section.innerHTML=`<h2>Test ${ti+1}</h2><small>2 Multiple Choice · 2 True/False · 1 Short Answer</small>`;test.forEach((item,qi)=>{let block=document.createElement('div');block.className='question';let p=document.createElement('p');p.textContent=`${qi+1}. ${item[0]}`;block.append(p);if(item[1])item[1].forEach((op,oi)=>{let label=document.createElement('label');label.className='option';let input=document.createElement('input');input.type='radio';input.name=`a${active}t${ti}q${qi}`;input.value=oi;label.append(input,document.createTextNode(' '+String.fromCharCode(65+oi)+') '+op));block.append(label)});else{let input=document.createElement('input');input.type='text';input.placeholder='Write your answer';block.append(input)}section.append(block)});let btn=document.createElement('button');btn.className='primary';btn.textContent='Check Answers';let result=document.createElement('div');btn.onclick=()=>{let score=0;let notes=[];test.forEach((item,qi)=>{if(item[1]){let selected=section.querySelector(`input[name="a${active}t${ti}q${qi}"]:checked`);if(selected&&Number(selected.value)===item[2])score++;else notes.push(`Q${qi+1}: ${item[1][item[2]]}`)}else notes.push(`Q${qi+1} suggested answer: ${item[2]}`)});result.className='feedback';result.textContent=`Objective score: ${score}/4. ${notes.join(' | ')}. Short answer requires self-check.`};section.append(btn,result);content.append(section)})}render();</script></body></html>
